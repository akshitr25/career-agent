<!DOCTYPE html>
<html>

<head>
    <title>AI Career Planner</title>

    <style>

        body {
          font-family: Arial;
          background: #0f172a;
          color: white;
          padding: 40px;
        }

        h1 {
          margin-bottom: 20px;
        }

        input {
          padding: 12px;
          width: 350px;
          border-radius: 8px;
          border: none;
          outline: none;
        }

        button {
          padding: 12px 20px;
          background: #3b82f6;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          margin-left: 10px;
        }

        button:hover {
          opacity: 0.9;
        }

        #roadmap {
          margin-top: 30px;
        }

        .card {
          background: #1e293b;
          padding: 20px;
          margin-bottom: 20px;
          border-radius: 12px;
        }

        .timeline {
          color: #93c5fd;
          margin-top: 10px;
        }

        ul {
          margin-top: 5px;
        }

    </style>

</head>

<body>

<h1>AI Career Planner</h1>

<input
        id="goal"
        placeholder="Enter career goal"
/>

<button onclick="send()">
    Generate Plan
</button>

<div id="roadmap"></div>
<div id="critique"></div>

<script>

    async function send() {

      const goal =
        document.getElementById("goal").value;

      const res = await fetch(
        `https://career-agent-0rnw.onrender.com/ask?q=${goal}`
      );

      const data = await res.json();

      renderRoadmap(data);
    }

    function renderRoadmap(data) {

      const roadmap =
        document.getElementById("roadmap");

      roadmap.innerHTML = "";

      const title =
        document.createElement("h2");

      title.innerText =
        data.goal;

      roadmap.appendChild(title);

      const critiqueDiv = document.getElementById("critique");

      critiqueDiv.innerHTML = `
        <div class="card">
            <h3>🤖 AI Review</h3>
            <p>${data.critique}</p>
        </div>
      `;

      data.phases.forEach(phase => {

        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `
          <h3>${phase.phase_name}</h3>

          <p><strong>Skills:</strong></p>
          <ul>
            ${phase.skills.map(
              skill => `<li>${skill}</li>`
            ).join("")}
          </ul>

          <p><strong>Projects:</strong></p>
          <ul>
            ${phase.projects.map(
              project => `<li>${project}</li>`
            ).join("")}
          </ul>

          <p class="timeline">
            Timeline: ${phase.timeline}
          </p>
        `;

        roadmap.appendChild(card);
      });
    }

</script>

</body>

</html>
