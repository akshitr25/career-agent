<!DOCTYPE html>
<html>

<head>
    <title>AI Career Planner</title>

    <style>
        body {
          font-family: Arial;
          background: #0f172a;
          color: white;
          padding: 40px;
        }

        h2 {
          margin-bottom: 20px;
        }

        input {
          padding: 10px;
          width: 320px;
          border-radius: 6px;
          border: none;
          outline: none;
        }

        button {
          padding: 10px 20px;
          margin-left: 10px;
          background: #3b82f6;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        button:hover {
          opacity: 0.9;
        }

        pre {
          margin-top: 20px;
          background: #1e293b;
          padding: 20px;
          border-radius: 10px;
          white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>AI Career Planner</h2>

<input
        id="goal"
        placeholder="Enter career goal"
/>

<button onclick="send()">
    Generate Plan
</button>

<pre id="output"></pre>

<script>
    async function send() {

      const goal =
        document.getElementById("goal").value;

      const res = await fetch(
        `https://YOUR-RENDER-URL.onrender.com/ask?q=${goal}`
      );

      const data = await res.json();

      document.getElementById("output").innerText =
        data.response;
    }
</script>

</body>

</html>
