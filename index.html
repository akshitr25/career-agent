<!DOCTYPE html>
<html>
<head>
    <title>AI Career Agent</title>
    <style>
        body {
          font-family: Arial;
          background: #0f172a;
          color: white;
          padding: 40px;
        }

        input {
          padding: 10px;
          width: 300px;
          border-radius: 6px;
          border: none;
        }

        button {
          padding: 10px 20px;
          margin-left: 10px;
          background: #3b82f6;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        pre {
          margin-top: 20px;
          background: #1e293b;
          padding: 20px;
          border-radius: 10px;
        }
    </style>
</head>
<body>
<h2>AI Task Planner</h2>

<input id="q" placeholder="Enter your goal" style="width:300px;" />
<button onclick="send()">Ask</button>

<pre id="output"></pre>

<script>
    async function send() {
      const q = document.getElementById("q").value;

      const res = await fetch(`https://ai-agent-q16p.onrender.com/ask?q=${q}`);
      const data = await res.json();

      document.getElementById("output").innerText = data.response;
    }
</script>
</body>
</html>
